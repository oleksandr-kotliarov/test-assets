<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Basic iframe example</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f8fc;
      color: #172033;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      background: #111827;
      color: #f8fafc;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 0;
      margin: 0;
      padding: 20px;
    }

    .card {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 14px;
      align-items: center;
      max-width: 680px;
      margin: 0 auto;
      padding: 18px;
      border: 1px solid #dbe2ee;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 12px 30px rgb(15 23 42 / 8%);
    }

    [data-theme="dark"] .card {
      border-color: #334155;
      background: #1e293b;
      box-shadow: 0 12px 30px rgb(0 0 0 / 25%);
    }

    .mark {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      border-radius: 14px;
      background: #e0e7ff;
      color: #4338ca;
      font-size: 22px;
      font-weight: 800;
    }

    [data-theme="dark"] .mark { background: #312e81; color: #c7d2fe; }
    h1 { margin: 0 0 4px; font-size: clamp(18px, 5vw, 24px); }
    p { margin: 0; color: #5b6475; line-height: 1.5; }
    [data-theme="dark"] p { color: #cbd5e1; }

    @media (max-width: 420px) {
      body { padding: 12px; }
      .card { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">A</div>
    <div>
      <h1 id="title">Basic iframe</h1>
      <p>This content is isolated from the parent page and scales to its container.</p>
    </div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const title = params.get('title');
    const theme = params.get('theme');

    if (title) {
      document.querySelector('#title').textContent = title;
      document.title = title;
    }

    if (theme === 'dark') {
      document.documentElement.dataset.theme = 'dark';
    }
  </script>
</body>
</html>
