<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive iframe example</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: transparent;
      color: #172033;
    }

    * { box-sizing: border-box; }
    body { margin: 0; padding: 8px; }

    .panel {
      overflow: hidden;
      border: 1px solid #bfdbfe;
      border-radius: 16px;
      background: #eff6ff;
    }

    .content { padding: 20px; }
    .eyebrow { margin: 0 0 6px; color: #1d4ed8; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 22px; }
    p { margin: 8px 0 0; color: #475569; line-height: 1.5; }

    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      background: #2563eb;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary { border: 1px solid #93c5fd; background: #fff; color: #1d4ed8; }
    button:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }

    .details {
      display: none;
      margin: 0;
      padding: 16px 20px 20px;
      border-top: 1px solid #bfdbfe;
      background: #fff;
      color: #334155;
      line-height: 1.5;
    }
    .details.visible { display: block; }
  </style>
</head>
<body>
  <main class="panel">
    <div class="content">
      <p class="eyebrow">postMessage example</p>
      <h1>Interactive iframe</h1>
      <p>Use the controls to send an action to the parent and change this iframe's height.</p>
      <div class="actions">
        <button id="notify" type="button">Notify parent</button>
        <button id="toggle" class="secondary" type="button" aria-expanded="false" aria-controls="details">Show details</button>
      </div>
    </div>
    <p id="details" class="details">The parent receives a resize message whenever this content changes, so it can remove scrollbars without reaching across origins.</p>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const iframeId = params.get('id') || 'interactive-example';

    function send(type, extra = {}) {
      window.parent.postMessage({
        source: 'test-assets',
        type,
        iframeId,
        ...extra
      }, '*');
    }

    function reportHeight() {
      send('iframe:resize', { height: Math.ceil(document.body.getBoundingClientRect().height) });
    }

    document.querySelector('#notify').addEventListener('click', () => {
      send('iframe:action', { action: 'notify' });
    });

    document.querySelector('#toggle').addEventListener('click', (event) => {
      const details = document.querySelector('#details');
      const visible = details.classList.toggle('visible');
      event.currentTarget.textContent = visible ? 'Hide details' : 'Show details';
      event.currentTarget.setAttribute('aria-expanded', String(visible));
      send('iframe:action', { action: visible ? 'details-opened' : 'details-closed' });
      reportHeight();
    });

    new ResizeObserver(reportHeight).observe(document.body);
    window.addEventListener('load', () => {
      send('iframe:ready');
      reportHeight();
    });
  </script>
</body>
</html>
